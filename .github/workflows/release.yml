name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14         # Apple Silicon
            goos: darwin
            goarch: arm64
            cgo: '1'
            archive: tar.gz
          - runner: macos-13         # Intel Mac
            goos: darwin
            goarch: amd64
            cgo: '1'
            archive: tar.gz
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: '1'
            archive: tar.gz
          - runner: ubuntu-latest    # cross-compile, no cgo on windows (purego)
            goos: windows
            goarch: amd64
            cgo: '0'
            archive: zip
            ext: '.exe'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install ALSA (linux native only)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build binaries
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/tempo-tty${{ matrix.ext }} ./cmd/tempo-tty
          go build -ldflags="-s -w" -o dist/play${{ matrix.ext }}      ./cmd/play
          go build -ldflags="-s -w" -o dist/analyze${{ matrix.ext }}   ./cmd/analyze

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          NAME=tempo-tty-${{ matrix.goos }}-${{ matrix.goarch }}
          cp README.md dist/
          tar -czf ${NAME}.tar.gz -C dist tempo-tty play analyze README.md
          shasum -a 256 ${NAME}.tar.gz > ${NAME}.tar.gz.sha256

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          NAME=tempo-tty-${{ matrix.goos }}-${{ matrix.goarch }}
          cp README.md dist/
          cd dist && zip -q ../${NAME}.zip tempo-tty.exe play.exe analyze.exe README.md
          cd .. && shasum -a 256 ${NAME}.zip > ${NAME}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tempo-tty-*.tar.gz
            tempo-tty-*.zip
            tempo-tty-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          body: |
            ## tempo-tty ${{ github.ref_name }}

            Terminal rhythm game in Go. Auto-generates charts from any audio file (mp3/wav/ogg/flac) or YouTube URL via spectral flux onset detection.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Apple Silicon Mac | `tempo-tty-darwin-arm64.tar.gz` |
            | Intel Mac (x86_64) | `tempo-tty-darwin-amd64.tar.gz` |
            | Linux (x86_64) | `tempo-tty-linux-amd64.tar.gz` |
            | Windows (x86_64) | `tempo-tty-windows-amd64.zip` |

            ### Install

            ```bash
            # macOS / Linux
            tar -xzf tempo-tty-<os>-<arch>.tar.gz
            ./tempo-tty
            ```

            ```powershell
            # Windows
            Expand-Archive tempo-tty-windows-amd64.zip
            cd tempo-tty-windows-amd64
            .\tempo-tty.exe
            ```

            ### Optional: YouTube support

            Install `yt-dlp` and `ffmpeg`:

            ```bash
            # macOS
            brew install yt-dlp ffmpeg

            # Linux
            sudo apt install yt-dlp ffmpeg

            # Windows
            winget install yt-dlp.yt-dlp Gyan.FFmpeg
            ```
